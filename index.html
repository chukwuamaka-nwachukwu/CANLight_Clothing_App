<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="CANLight Clothing — fashion that makes uniqueness special."
    />

    <meta
      name="theme-color"
      content="#111827"
    />

    <!-- =====================================================
         OPEN SANS
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         PWA
    ====================================================== -->

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="CANLight Clothing"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <!-- =====================================================
         APPLE TOUCH ICON
    ====================================================== -->

    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>CANLight Clothing</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run CANLight Clothing.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
